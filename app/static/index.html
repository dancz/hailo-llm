<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hailo LLM Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;}
        #chat-history { flex-grow: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
        .user { background-color: #e3f2fd; align-self: flex-end; text-align: right; }
        .assistant { background-color: #f1f8e9; align-self: flex-start; }
        #input-area { display: flex; gap: 10px; }
        #prompt-input { flex-grow: 1; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        button:disabled { background-color: #ccc; }
    </style>
</head>
<body>
    <h1>Hailo LLM Chat</h1>
    <div id="chat-history"></div>
    <div id="input-area">
        <input type="text" id="prompt-input" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        
        let messages = [];

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            // Add user message to UI
            appendMessage('user', text);
            messages.push({ role: 'user', content: text });
            promptInput.value = '';
            sendBtn.disabled = true;

            // Create assistant message placeholder
            const assistMsgDiv = appendMessage('assistant', '');
            let fullResponse = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'qwen2.5',
                        messages: messages
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const json = JSON.parse(line);
                            if (json.message && json.message.content) {
                                const content = json.message.content;
                                fullResponse += content;
                                assistMsgDiv.textContent = fullResponse;
                                // Auto scroll
                                chatHistory.scrollTop = chatHistory.scrollHeight;
                            }
                            if (json.done) {
                                console.log("Done");
                            }
                        } catch (e) {
                            console.error("Error parsing JSON chunk", e);
                        }
                    }
                }
                
                messages.push({ role: 'assistant', content: fullResponse });

            } catch (err) {
                console.error("Error:", err);
                assistMsgDiv.textContent += " [Error generating response]";
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = role === 'user' ? text : text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        }

        sendBtn.addEventListener('click', sendMessage);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
